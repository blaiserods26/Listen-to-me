name: Website Monitor

on:
  schedule:
    # Run every hour (at minute 0 of every hour)
    # Adjust this cron expression as needed:
    # '*/30 * * * *' = every 30 minutes
    # '0 * * * *'   = every 1 hour
    # '0 */6 * * *' = every 6 hours
    # '0 0 * * *'   = once daily at midnight UTC
    - cron: '0 * * * *'
  workflow_dispatch: # Allows manual trigger anytime from the Actions tab

# Needed so GitHub Actions can commit the updated state.json back to the repository
permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Web Listener (Single Pass)
        env:
          TARGET_URLS: ${{ secrets.TARGET_URLS || vars.TARGET_URLS }}
          TARGET_URL: ${{ secrets.TARGET_URL || vars.TARGET_URL }}
          CSS_SELECTOR: ${{ secrets.CSS_SELECTOR || vars.CSS_SELECTOR }}
          STRIP_DYNAMIC_TAGS: ${{ vars.STRIP_DYNAMIC_TAGS || 'true' }}
          STATE_FILE_PATH: "state.json"
          SITES_FILE_PATH: ${{ vars.SITES_FILE_PATH }}
          SMTP_SERVER: ${{ secrets.SMTP_SERVER || vars.SMTP_SERVER || 'smtp.gmail.com' }}
          SMTP_PORT: ${{ secrets.SMTP_PORT || vars.SMTP_PORT || '587' }}
          SMTP_USE_TLS: ${{ secrets.SMTP_USE_TLS || vars.SMTP_USE_TLS || 'true' }}
          SMTP_USE_SSL: ${{ secrets.SMTP_USE_SSL || vars.SMTP_USE_SSL || 'false' }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER || secrets.SMTP_USERNAME }}
          EMAIL_RECIPIENT: ${{ secrets.EMAIL_RECIPIENT }}
          EMAIL_SUBJECT_PREFIX: ${{ vars.EMAIL_SUBJECT_PREFIX || '[Web-Listener Alert]' }}
          PROXY: ${{ secrets.PROXY || vars.PROXY }}
        run: |
          python main.py --once

      - name: Save updated state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state.json
          if ! git diff --staged --quiet; then
            git commit -m "chore: update website monitor state [skip ci]"
            git push
          else
            echo "No state changes to commit."
          fi
